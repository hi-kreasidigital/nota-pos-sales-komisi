name: Keep Supabase Awake

# Supabase free tier otomatis pause project setelah 7 hari tanpa aktivitas API.
# Workflow ini "mengetuk" database 2x seminggu (Senin & Kamis) supaya tidak pernah
# kena pause, walaupun tidak ada sales/admin yang buka sistemnya.

on:
  schedule:
    - cron: "0 3 * * 1,4" # Senin & Kamis, jam 03:00 UTC (~10:00 WIB)
  workflow_dispatch: {} # tombol "Run workflow" manual di tab Actions

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf -o /dev/null -w "Status: %{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/settings?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
